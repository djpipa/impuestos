<title>Impuestos Familiares</title>

<style>
  :root {
    --paper: #EFF1E4;
    --paper-line: #D9DCC7;
    --card-bg: #FBFAF3;
    --ink: #232B24;
    --ink-soft: #5C6657;
    --up: #B23A3A;
    --down: #3F8F5F;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', sans-serif; color: var(--ink); background: var(--paper); }
  .app { min-height: 100vh; padding: 24px; max-width: 1100px; margin: 0 auto; }

  .header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; margin-bottom: 8px; }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand-mark { font-family:'Fraunces', serif; font-size:28px; font-weight:600; width:44px; height:44px; display:flex; align-items:center; justify-content:center; background: var(--ink); color: var(--paper); border-radius: 10px; }
  .brand h1 { font-family:'Fraunces', serif; font-size:24px; font-weight:600; margin:0; letter-spacing:-0.01em; }
  .brand-sub { margin:2px 0 0; font-size:13px; color: var(--ink-soft); }

  .header-actions { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .toolbar { display:flex; gap:8px; }
  .toolbar-btn { display:flex; align-items:center; gap:6px; border:1px solid var(--paper-line); background: var(--card-bg); color: var(--ink-soft); font-family:'Inter'; font-size:13px; font-weight:500; padding:8px 12px; border-radius:9px; cursor:pointer; }
  .toolbar-btn:hover { color: var(--ink); border-color: var(--ink-soft); }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 8px; font-size: 13px; font-family: 'Inter'; box-shadow: 0 4px 16px rgba(0,0,0,0.2); z-index: 100; }

  .updated-note { font-size:11px; color: var(--ink-soft); text-align:right; margin: 0 0 18px; }
  .updated-note span { font-family:'Space Mono', monospace; color: var(--ink); }

  .tabs { display:flex; background: var(--card-bg); border:1px solid var(--paper-line); border-radius: 10px; padding:4px; }
  .tab { border:none; background:transparent; padding:8px 18px; font-family:'Inter'; font-size:14px; font-weight:500; color: var(--ink-soft); border-radius:7px; cursor:pointer; }
  .tab.active { background: var(--ink); color: var(--paper); }

  .house-bar { margin-bottom: 22px; padding-bottom: 16px; border-bottom: 1px dashed var(--paper-line); }
  .house-bar-label { font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color: var(--ink-soft); margin: 0 0 8px 2px; }
  .house-tabs { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .house-tab { font-family:'Fraunces', serif; font-size:14px; font-weight:600; padding:8px 16px; border-radius:9px; border:1px solid var(--paper-line); background: var(--card-bg); color: var(--ink-soft); cursor:grab; }
  .house-tab:active { cursor:grabbing; }
  .house-tab.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .house-tab.drag-over { outline: 2px dashed var(--ink-soft); outline-offset: 2px; }
  .house-tab-input { font-family:'Fraunces', serif; font-size:14px; font-weight:600; padding:7px 14px; border-radius:9px; border:1.5px solid var(--ink); background: var(--card-bg); color: var(--ink); }
  .house-tab.add { font-family:'Inter'; font-weight:500; border-style:dashed; color: var(--ink-soft); background: transparent; cursor:pointer; }
  .house-tab.add:hover { color: var(--ink); border-color: var(--ink-soft); }
  .house-tab-add-form input { font-family:'Inter'; font-size:13px; padding:7px 12px; border-radius:9px; border:1.5px solid var(--ink); background: var(--card-bg); }
  .house-heading { font-family:'Fraunces', serif; font-size:19px; font-weight:600; margin: 0 0 16px 2px; }

  .cards-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:20px; }

  .card { position:relative; background: var(--card-bg); border:1px solid var(--paper-line); border-radius: 14px; padding: 22px 18px 16px; overflow:hidden; transition: outline 0.1s ease; }
  .card.drag-over { outline: 2px dashed var(--ink-soft); outline-offset: 3px; }
  .card-scallop { position:absolute; top:-8px; left:0; right:0; height:16px; background-image: radial-gradient(circle at 8px 8px, transparent 7px, var(--paper) 7.5px); background-size: 16px 16px; background-repeat: repeat-x; }
  .card-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:8px; }
  .card-title { display:flex; align-items:center; gap:8px; min-width:0; }
  .card-title .cat-icon { font-size:16px; }
  .card-title h2 { font-family:'Fraunces', serif; font-size:17px; font-weight:600; margin:0; color: var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card-head-actions { display:flex; align-items:center; gap:2px; flex-shrink:0; }
  .drag-handle { cursor:grab; color: var(--ink-soft); font-size:15px; padding:2px 5px; user-select:none; line-height:1; border-radius:5px; }
  .drag-handle:hover { background: var(--paper); color: var(--ink); }
  .drag-handle:active { cursor:grabbing; }

  .ledger { display:flex; flex-direction:column; gap:8px; margin-bottom: 14px; min-height: 20px; }
  .empty-row { font-size:13px; color: var(--ink-soft); font-style:italic; margin:6px 0; }
  .ledger-row { display:flex; align-items:center; gap:8px; font-family:'Space Mono', monospace; font-size:13px; }
  .ledger-row.placeholder { opacity: 0.75; }
  .ledger-date { color: var(--ink-soft); white-space:nowrap; }
  .ledger-dots { flex:1; border-bottom: 1px dotted var(--paper-line); margin-bottom:4px; }
  .ledger-amount { font-weight:700; white-space:nowrap; }
  .ledger-amount-empty { font-style:italic; font-weight:400; color: var(--ink-soft); white-space:nowrap; }
  .delta { display:flex; align-items:center; gap:2px; font-size:11px; font-family:'Inter'; padding:2px 6px; border-radius:6px; white-space:nowrap; }
  .delta.up { color: var(--up); background: rgba(178,58,58,0.1); }
  .delta.down { color: var(--down); background: rgba(63,143,95,0.1); }

  .icon-btn { border:none; background:transparent; color: var(--ink-soft); cursor:pointer; padding:3px 5px; display:flex; border-radius:5px; font-size:12px; line-height:1; }
  .icon-btn:hover { background: var(--paper); color: var(--ink); }

  .edit-input { width:80px; font-family:'Space Mono', monospace; font-size:13px; padding:2px 6px; border:1px solid var(--cat-color, var(--ink-soft)); border-radius:5px; }

  .add-row { display:flex; gap:6px; padding-top:12px; border-top:1px solid var(--paper-line); }
  .add-row select, .year-input, .amount-input { font-family:'Inter'; font-size:12px; border:1px solid var(--paper-line); border-radius:6px; padding:6px; background: var(--paper); color: var(--ink); }
  .year-input { width:56px; }
  .amount-input { flex:1; min-width:0; }
  .add-btn { border:none; color:#fff; border-radius:6px; padding:0 10px; display:flex; align-items:center; cursor:pointer; font-size:16px; }

  .add-category-card { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; border:1.5px dashed var(--paper-line); border-radius:14px; background:transparent; color: var(--ink-soft); min-height:140px; cursor:pointer; font-family:'Inter'; font-size:14px; }
  .add-category-card:hover { border-color: var(--ink-soft); color: var(--ink); }
  .add-category-card.form { align-items:stretch; padding:18px; cursor:default; }
  .add-category-card.form input { font-family:'Inter'; font-size:14px; padding:8px 10px; border:1px solid var(--paper-line); border-radius:7px; margin-bottom:10px; width:100%; }
  .swatches { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .swatch { width:22px; height:22px; border-radius:50%; border:2px solid transparent; cursor:pointer; }
  .swatch.selected { border-color: var(--ink); }
  .form-actions { display:flex; gap:8px; }
  .save-btn { flex:1; background: var(--ink); color: var(--paper); border:none; border-radius:7px; padding:8px; font-weight:600; cursor:pointer; }
  .cancel-btn { background:transparent; border:1px solid var(--paper-line); border-radius:7px; padding:8px 12px; cursor:pointer; color: var(--ink-soft); }

  .dashboard { display:flex; flex-direction:column; gap:20px; }
  .dashboard.empty-state { align-items:center; justify-content:center; text-align:center; padding:80px 20px; color: var(--ink-soft); gap:10px; }
  .dashboard.empty-state h2 { font-family:'Fraunces', serif; color:var(--ink); margin:8px 0 0; }
  .dashboard.empty-state .big-icon { font-size:40px; }

  .summary-row { display:grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap:14px; }
  .summary-card { background: var(--card-bg); border:1px solid var(--paper-line); border-left: 4px solid var(--cat-color); border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:4px; }
  .summary-name { font-size:12px; text-transform:uppercase; letter-spacing:0.05em; color: var(--ink-soft); }
  .summary-amount { font-family:'Space Mono', monospace; font-size:22px; font-weight:700; }

  .chart-panel { background: var(--card-bg); border:1px solid var(--paper-line); border-radius:14px; padding:18px 12px; }
  .chart-panel h3 { font-family:'Fraunces', serif; font-size:16px; font-weight:600; margin:0 0 12px 12px; }

  @media (max-width: 520px) {
    .header { flex-direction:column; align-items:flex-start; }
    .updated-note { text-align:left; }
  }
</style>
</head>

function formatARS(n) {
  return new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 0 }).format(n);
}
function uid() {
  return Math.random().toString(36).slice(2, 10);
}
function ymKey(y, m) { return y * 12 + m; }
function monthsBetween(y1, m1, y2, m2) {
  const start = ymKey(y1, m1), end = ymKey(y2, m2);
  const out = [];
  for (let k = start; k <= end; k++) {
    out.push({ year: Math.floor(k / 12), month: ((k % 12) + 12) % 12 });
  }
  return out;
}
function buildLedgerRows(entries, categoryId) {
  const real = [...entries].sort((a, b) => ymKey(a.year, a.month) - ymKey(b.year, b.month));
  if (real.length < 2) return real.map((e) => ({ ...e, __placeholder: false }));
  const first = real[0], last = real[real.length - 1];
  const range = monthsBetween(first.year, first.month, last.year, last.month);
  const byKey = new Map(real.map((e) => [ymKey(e.year, e.month), e]));
  return range.map(({ year, month }) => {
    const found = byKey.get(ymKey(year, month));
    if (found) return { ...found, __placeholder: false };
    return { id: `ph-${year}-${month}`, categoryId, month, year, amount: null, __placeholder: true };
  });
}
function formatUpdated(iso) {
  if (!iso) return null;
  return new Date(iso).toLocaleString("es-AR", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" });
}

          setHouses(data.houses);
          setActiveHouseId(data.activeHouseId && data.houses.some((h) => h.id === data.activeHouseId) ? data.activeHouseId : data.houses[0].id);
          setLastModified(data.lastModified || null);
        } else if (data.categories) {
          const migrated = defaultHouses();
          migrated[0] = { ...migrated[0], categories: data.categories, entries: data.entries || [] };
          setHouses(migrated);
          setActiveHouseId(migrated[0].id);
        } else {
          const fresh = defaultHouses();
          setHouses(fresh);
          setActiveHouseId(fresh[0].id);
        }
      } else {
        const fresh = defaultHouses();
        setHouses(fresh);
        setActiveHouseId(fresh[0].id);
      }
    } catch (e) {
      const fresh = defaultHouses();
      setHouses(fresh);
      setActiveHouseId(fresh[0].id);
    } finally {
      setLoaded(true);
    }
  }, []);

  useEffect(() => {
    if (!loaded) return;
    const now = new Date().toISOString();
    setLastModified(now);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ houses, activeHouseId, lastModified: now }));
    } catch (e) {
      console.error("No se pudo guardar", e);
    }
  }, [houses, activeHouseId, loaded]);

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(null), 2600);
  }

  const activeHouse = houses.find((h) => h.id === activeHouseId) || houses[0];

  function updateActiveHouse(patchFn) {
    setHouses((prev) => prev.map((h) => (h.id === activeHouse.id ? patchFn(h) : h)));
  }

  function addEntry(categoryId, entry) {
    updateActiveHouse((h) => ({ ...h, entries: [...h.entries, { id: uid(), categoryId, ...entry }] }));
  }
  function updateEntry(id, patch) {
    updateActiveHouse((h) => ({ ...h, entries: h.entries.map((e) => (e.id === id ? { ...e, ...patch } : e)) }));
  }
  function deleteEntry(id) {
    updateActiveHouse((h) => ({ ...h, entries: h.entries.filter((e) => e.id !== id) }));
  }
  function addCategory(name, color) {
    updateActiveHouse((h) => ({ ...h, categories: [...h.categories, { id: uid(), name, color, icon: "🧾" }] }));
  }
  function deleteCategory(id) {
    updateActiveHouse((h) => ({
      ...h,
      categories: h.categories.filter((c) => c.id !== id),
      entries: h.entries.filter((e) => e.categoryId !== id),
    }));
  }
  function renameHouse(id, newName) {
    setHouses((prev) => prev.map((h) => (h.id === id ? { ...h, name: newName } : h)));
  }
  function addHouse(name) {
    const newHouse = { id: uid(), name, categories: defaultCategories(), entries: [] };
    setHouses((prev) => [...prev, newHouse]);
    setActiveHouseId(newHouse.id);
  }
  function reorderHouses(fromIndex, toIndex) {
    setHouses((prev) => {
      const arr = [...prev];
      const [moved] = arr.splice(fromIndex, 1);
      arr.splice(toIndex, 0, moved);
      return arr;
    });
  }
  function reorderCategories(fromIndex, toIndex) {
    updateActiveHouse((h) => {
      const arr = [...h.categories];
      const [moved] = arr.splice(fromIndex, 1);
      arr.splice(toIndex, 0, moved);
      return { ...h, categories: arr };
    });
  }

  function exportData() {
    const payload = { houses, activeHouseId, lastModified, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `impuestos-familiares-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("Backup descargado ✓");
  }

  function triggerImport() {
    fileInputRef.current && fileInputRef.current.click();
  }

  function handleImportFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data.houses) throw new Error("Formato inválido");
        const ok = window.confirm(
          `Este backup tiene ${data.houses.length} casa(s).\n\n¿Reemplazar los datos actuales por los del backup?`
        );
        if (ok) {
          setHouses(data.houses);
          setActiveHouseId(data.houses[0] ? data.houses[0].id : null);
          showToast("Datos importados ✓");
        }
      } catch (err) {
        window.alert("No se pudo leer el archivo. ¿Es un backup válido?");
      } finally {
        e.target.value = "";
      }
    };
    reader.readAsText(file);
  }

  if (!activeHouse) return null;

  return (
    <div className="app">
      <header className="header">
        <div className="brand">
          <span className="brand-mark">$</span>
          <div>
            <h1>Impuestos Familiares</h1>
            <p className="brand-sub">Sistema web de impuestos by Djpipa</p>
          </div>
        </div>
        <div className="header-actions">
          <div className="toolbar">
            <button className="toolbar-btn" onClick={exportData} title="Descargar un backup en un archivo .json">⬇ Exportar</button>
            <button className="toolbar-btn" onClick={triggerImport} title="Restaurar datos desde un backup .json">⬆ Importar</button>
            <input ref={fileInputRef} type="file" accept="application/json" style={{ display: "none" }} onChange={handleImportFile} />
          </div>
          <nav className="tabs">
            <button className={view === "cargar" ? "tab active" : "tab"} onClick={() => setView("cargar")}>Cargar</button>
            <button className={view === "dashboard" ? "tab active" : "tab"} onClick={() => setView("dashboard")}>Dashboard</button>
          </nav>
        </div>
      </header>
      {toast && <div className="toast">{toast}</div>}

      {lastModified && (
        <p className="updated-note">Actualizado al <span>{formatUpdated(lastModified)}</span></p>
      )}

      <div className="house-bar">
        <p className="house-bar-label">Casa</p>
        <HouseTabs
          houses={houses}
          activeId={activeHouse.id}
          setActiveId={setActiveHouseId}
          onRename={renameHouse}
          onAdd={addHouse}
          onReorder={reorderHouses}
        />
      </div>

      <h2 className="house-heading">{activeHouse.name}</h2>

      {view === "cargar" ? (
        <CargarView
          categories={activeHouse.categories}
          entries={activeHouse.entries}
          addEntry={addEntry}
          updateEntry={updateEntry}
          deleteEntry={deleteEntry}
          deleteCategory={deleteCategory}
          showAddCategory={showAddCategory}
          setShowAddCategory={setShowAddCategory}
          addCategory={addCategory}
          onReorderCategories={reorderCategories}
        />
      ) : (
        <DashboardView categories={activeHouse.categories} entries={activeHouse.entries} />
      )}
    </div>
  );
}

function HouseTabs({ houses, activeId, setActiveId, onRename, onAdd, onReorder }) {
  const [editingId, setEditingId] = useState(null);
  const [editValue, setEditValue] = useState("");
  const [adding, setAdding] = useState(false);
  const [newName, setNewName] = useState("");
  const [overIndex, setOverIndex] = useState(null);
  const dragFrom = useRef(null);

  function startEdit(house) {
    setEditingId(house.id);
    setEditValue(house.name);
  }
  function commitEdit() {
    if (editValue.trim()) onRename(editingId, editValue.trim());
    setEditingId(null);
  }
  function submitAdd(e) {
    e.preventDefault();
    if (!newName.trim()) { setAdding(false); return; }
    onAdd(newName.trim());
    setNewName("");
    setAdding(false);
  }

  return (
    <div className="house-tabs">
      {houses.map((h, index) => (
        editingId === h.id ? (
          <input
            key={h.id}
            className="house-tab-input"
            value={editValue}
            autoFocus
            onChange={(e) => setEditValue(e.target.value)}
            onBlur={commitEdit}
            onKeyDown={(e) => { if (e.key === "Enter") commitEdit(); if (e.key === "Escape") setEditingId(null); }}
          />
        ) : (
          <button
            key={h.id}
            className={"house-tab" + (h.id === activeId ? " active" : "") + (overIndex === index ? " drag-over" : "")}
            draggable
            onDragStart={() => { dragFrom.current = index; }}
            onDragOver={(e) => { e.preventDefault(); }}
            onDragEnter={() => setOverIndex(index)}
            onDragLeave={() => setOverIndex((v) => (v === index ? null : v))}
            onDrop={(e) => {
              e.preventDefault();
              setOverIndex(null);
              if (dragFrom.current !== null && dragFrom.current !== index) onReorder(dragFrom.current, index);
              dragFrom.current = null;
            }}
            onClick={() => setActiveId(h.id)}
            onDoubleClick={() => startEdit(h)}
            title="Arrastrá para reordenar · doble clic para renombrar"
          >
            {h.name}
          </button>
        )
      ))}
      {adding ? (
        <form className="house-tab-add-form" onSubmit={submitAdd}>
          <input
            autoFocus
            placeholder="Nombre de la casa"
            value={newName}
            onChange={(e) => setNewName(e.target.value)}
            onBlur={() => { if (!newName.trim()) setAdding(false); }}
          />
        </form>
      ) : (
        <button className="house-tab add" onClick={() => setAdding(true)}>+ Casa</button>
      )}
    </div>
  );
}

function CargarView({ categories, entries, addEntry, updateEntry, deleteEntry, deleteCategory, showAddCategory, setShowAddCategory, addCategory, onReorderCategories }) {
  const dragFrom = useRef(null);
  const [overIndex, setOverIndex] = useState(null);

  return (
    <main className="cargar">
      <div className="cards-grid">
        {categories.map((cat, index) => (
          <CategoryCard
            key={cat.id}
            category={cat}
            entries={entries.filter((e) => e.categoryId === cat.id)}
            onAdd={(entry) => addEntry(cat.id, entry)}
            onUpdate={updateEntry}
            onDelete={deleteEntry}
            onDeleteCategory={() => deleteCategory(cat.id)}
            isDragOver={overIndex === index}
            onDragStart={() => { dragFrom.current = index; }}
            onDragOver={() => setOverIndex(index)}
            onDragLeave={() => setOverIndex((v) => (v === index ? null : v))}
            onDrop={() => {
              setOverIndex(null);
              if (dragFrom.current !== null && dragFrom.current !== index) onReorderCategories(dragFrom.current, index);
              dragFrom.current = null;
            }}
          />
        ))}
        <AddCategoryCard show={showAddCategory} setShow={setShowAddCategory} onAdd={addCategory} usedColors={categories.map((c) => c.color)} />
      </div>
    </main>
  );
}

function CategoryCard({ category, entries, onAdd, onUpdate, onDelete, onDeleteCategory, isDragOver, onDragStart, onDragOver, onDragLeave, onDrop }) {
  const rows = useMemo(() => buildLedgerRows(entries, category.id), [entries, category.id]);
  const [month, setMonth] = useState(new Date().getMonth());
  const [year, setYear] = useState(new Date().getFullYear());
  const [amount, setAmount] = useState("");
  const [editing, setEditing] = useState(null);
  const [editAmount, setEditAmount] = useState("");

  function submit(e) {
    e.preventDefault();
    const val = parseFloat(amount);
    if (isNaN(val) || val < 0) return;
    onAdd({ month: Number(month), year: Number(year), amount: val });
    setAmount("");
  }
  function startEdit(entry) {
    setEditing({ id: entry.id, isPlaceholder: !!entry.__placeholder, month: entry.month, year: entry.year });
    setEditAmount(entry.amount != null ? String(entry.amount) : "");
  }
  function saveEdit() {
    const val = parseFloat(editAmount);
    if (isNaN(val) || val < 0) return;
    if (editing.isPlaceholder) {
      onAdd({ month: editing.month, year: editing.year, amount: val });
    } else {
      onUpdate(editing.id, { amount: val });
    }
    setEditing(null);
  }

  let lastAmount = null;

  return (
    <section
      className={"card" + (isDragOver ? " drag-over" : "")}
      style={{ "--cat-color": category.color }}
      onDragOver={(e) => { e.preventDefault(); onDragOver(); }}
      onDragLeave={onDragLeave}
      onDrop={(e) => { e.preventDefault(); onDrop(); }}
    >
      <div className="card-scallop" />
      <div className="card-head">
        <div className="card-title">
          <span className="cat-icon">{category.icon}</span>
          <h2>{category.name}</h2>
        </div>
        <div className="card-head-actions">
          <span className="drag-handle" draggable onDragStart={onDragStart} title="Arrastrar para reordenar">⠿</span>
          {category.id.length > 6 && (
            <button className="icon-btn" onClick={onDeleteCategory} title="Eliminar categoría">🗑</button>
          )}
        </div>
      </div>

      <div className="ledger">
        {rows.length === 0 && <p className="empty-row">Sin registros todavía</p>}
        {rows.map((entry) => {
          let delta = null;
          if (!entry.__placeholder) {
            if (lastAmount !== null) delta = ((entry.amount - lastAmount) / lastAmount) * 100;
            lastAmount = entry.amount;
          }
          const isEditingThis = editing && editing.id === entry.id;
          return (
            <div className={"ledger-row" + (entry.__placeholder ? " placeholder" : "")} key={entry.id}>
              <span className="ledger-date">{MONTHS[entry.month]} {String(entry.year).slice(2)}</span>
              <span className="ledger-dots" />
              {isEditingThis ? (
                <>
                  <input className="edit-input" type="number" value={editAmount} onChange={(e) => setEditAmount(e.target.value)} autoFocus />
                  <button className="icon-btn" onClick={saveEdit}>✓</button>
                  <button className="icon-btn" onClick={() => setEditing(null)}>✕</button>
                </>
              ) : entry.__placeholder ? (
                <>
                  <span className="ledger-amount-empty">Sin cargar</span>
                  <button className="icon-btn" onClick={() => startEdit(entry)} title="Cargar monto">+</button>
                </>
              ) : (
                <>
                  <span className="ledger-amount">{formatARS(entry.amount)}</span>
                  {delta !== null && (
                    <span className={"delta " + (delta >= 0 ? "up" : "down")}>
                      {delta >= 0 ? "▲" : "▼"} {Math.abs(delta).toFixed(0)}%
                    </span>
                  )}
                  <button className="icon-btn" onClick={() => startEdit(entry)}>✏️</button>
                  <button className="icon-btn" onClick={() => onDelete(entry.id)}>🗑</button>
                </>
              )}
            </div>
          );
        })}
      </div>

      <form className="add-row" onSubmit={submit}>
        <select value={month} onChange={(e) => setMonth(e.target.value)}>
          {MONTHS_FULL.map((m, i) => <option value={i} key={i}>{m}</option>)}
        </select>
        <input type="number" className="year-input" value={year} onChange={(e) => setYear(e.target.value)} />
        <input type="number" className="amount-input" placeholder="Monto" value={amount} onChange={(e) => setAmount(e.target.value)} min="0" step="0.01" />
        <button type="submit" className="add-btn" style={{ background: category.color }}>+</button>
      </form>
    </section>
  );
}

function AddCategoryCard({ show, setShow, onAdd, usedColors }) {
  const [name, setName] = useState("");
  const availableColor = PALETTE.find((c) => !usedColors.includes(c)) || PALETTE[0];
  const [color, setColor] = useState(availableColor);

  function submit(e) {
    e.preventDefault();
    if (!name.trim()) return;
    onAdd(name.trim(), color);
    setName("");
    setShow(false);
  }

  if (!show) {
    return (
      <button className="add-category-card" onClick={() => setShow(true)}>
        <span style={{ fontSize: 22 }}>+</span>
        <span>Agregar ítem</span>
      </button>
    );
  }

  return (
    <form className="add-category-card form" onSubmit={submit}>
      <input autoFocus placeholder="Nombre (ej: Internet, Expensas)" value={name} onChange={(e) => setName(e.target.value)} />
      <div className="swatches">
        {PALETTE.map((c) => (
          <button type="button" key={c} className={"swatch" + (c === color ? " selected" : "")} style={{ background: c }} onClick={() => setColor(c)} />
        ))}
      </div>
      <div className="form-actions">
        <button type="submit" className="save-btn">Crear</button>
        <button type="button" className="cancel-btn" onClick={() => setShow(false)}>Cancelar</button>
      </div>
    </form>
  );
}

function DashboardView({ categories, entries }) {
  const timeline = useMemo(() => {
    const keys = new Set(entries.map((e) => `${e.year}-${String(e.month).padStart(2, "0")}`));
    const sortedKeys = [...keys].sort();
    return sortedKeys.map((key) => {
      const [y, m] = key.split("-").map(Number);
      const row = { key, label: `${MONTHS[m]} ${String(y).slice(2)}` };
      let total = 0;
      categories.forEach((cat) => {
        const found = entries.find((e) => e.categoryId === cat.id && e.year === y && e.month === m);
        if (found) { row[cat.name] = found.amount; total += found.amount; }
      });
      row.__total = total;
      return row;
    });
  }, [categories, entries]);

  const summary = useMemo(() => {
    return categories.map((cat) => {
      const catEntries = entries.filter((e) => e.categoryId === cat.id).sort((a, b) => a.year - b.year || a.month - b.month);
      const last = catEntries[catEntries.length - 1];
      const prev = catEntries[catEntries.length - 2];
      const delta = last && prev ? ((last.amount - prev.amount) / prev.amount) * 100 : null;
      return { cat, last, delta };
    });
  }, [categories, entries]);

  if (entries.length === 0) {
    return (
      <main className="dashboard empty-state">
        <span className="big-icon">🧾</span>
        <h2>Todavía no hay nada para mostrar</h2>
        <p>Cargá algunas facturas en la pestaña "Cargar" y el dashboard se arma solo.</p>
      </main>
    );
  }

  return (
    <main className="dashboard">
      <div className="summary-row">
        {summary.map(({ cat, last, delta }) => (
          <div className="summary-card" key={cat.id} style={{ "--cat-color": cat.color }}>
            <span className="summary-name">{cat.name}</span>
            <span className="summary-amount">{last ? formatARS(last.amount) : "—"}</span>
            {delta !== null && (
              <span className={"delta " + (delta >= 0 ? "up" : "down")}>
                {delta >= 0 ? "▲" : "▼"} {Math.abs(delta).toFixed(0)}% vs. mes anterior
              </span>
            )}
          </div>
        ))}
      </div>

      <div className="chart-panel">
        <h3>Evolución mensual</h3>
        <ResponsiveContainer width="100%" height={280}>
          <LineChart data={timeline}>
            <CartesianGrid strokeDasharray="3 3" stroke="var(--paper-line)" />
            <XAxis dataKey="label" stroke="var(--ink-soft)" fontSize={12} />
            <YAxis stroke="var(--ink-soft)" fontSize={12} tickFormatter={(v) => `$${v}`} />
            <Tooltip formatter={(v) => formatARS(v)} contentStyle={{ background: "var(--card-bg)", border: "1px solid var(--paper-line)", borderRadius: 8, fontFamily: "Inter, sans-serif" }} />
            <Legend />
            {categories.map((cat) => (
              <Line key={cat.id} type="monotone" dataKey={cat.name} stroke={cat.color} strokeWidth={2.5} dot={{ r: 3 }} connectNulls />
            ))}
          </LineChart>
        </ResponsiveContainer>
      </div>

      <div className="chart-panel">
        <h3>Total mensual (todos los ítems)</h3>
        <ResponsiveContainer width="100%" height={240}>
          <BarChart data={timeline}>
            <CartesianGrid strokeDasharray="3 3" stroke="var(--paper-line)" />
            <XAxis dataKey="label" stroke="var(--ink-soft)" fontSize={12} />
            <YAxis stroke="var(--ink-soft)" fontSize={12} tickFormatter={(v) => `$${v}`} />
            <Tooltip formatter={(v) => formatARS(v)} contentStyle={{ background: "var(--card-bg)", border: "1px solid var(--paper-line)", borderRadius: 8, fontFamily: "Inter, sans-serif" }} />
            <Bar dataKey="__total" name="Total" fill="var(--ink)" radius={[4, 4, 0, 0]} />
          </BarChart>
        </ResponsiveContainer>
      </div>
    </main>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
